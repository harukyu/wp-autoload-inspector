name: Syntax, behavior and packaging
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Isolated report behavior
        run: php tests/run.php
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Build publication archives
        run: python tools/package.py
  wordpress-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only
          MYSQL_DATABASE: wp_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, mbstring, zip
          coverage: none
      - name: Install disposable WordPress and plugin
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/wp-cli.phar" \
            https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          php "$RUNNER_TEMP/wp-cli.phar" core download --version=7.1.4 --path="$RUNNER_TEMP/wp"
          php "$RUNNER_TEMP/wp-cli.phar" core config --path="$RUNNER_TEMP/wp" \
            --dbname=wp_ci --dbuser=root --dbpass=ci-only --dbhost=127.0.0.1
          php "$RUNNER_TEMP/wp-cli.phar" config set WP_ENVIRONMENT_TYPE local --path="$RUNNER_TEMP/wp" --type=constant
          php "$RUNNER_TEMP/wp-cli.phar" core install --path="$RUNNER_TEMP/wp" \
            --url=http://localhost --title='Autoload report test' --admin_user=ci \
            --admin_password=ci-only --admin_email=ci@example.invalid --skip-email
          python3 tools/package.py
          php "$RUNNER_TEMP/wp-cli.phar" plugin install \
            "$GITHUB_WORKSPACE/dist/nakaryu-autoload-inspector-0.1.1.zip" \
            --activate --path="$RUNNER_TEMP/wp"
      - name: Check report against real WordPress and MySQL
        run: |
          php "$RUNNER_TEMP/wp-cli.phar" eval-file \
            "$GITHUB_WORKSPACE/tests/wordpress-mysql.php" --path="$RUNNER_TEMP/wp"
